<svg xmlns="http://www.w3.org/2000/svg" width="961" height="200" viewBox="0 0 961 200" role="img" aria-label="Hello! Here is kosmigen">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A8DFFF"/>
      <stop offset="1" stop-color="#EFFAFF"/>
    </linearGradient>
    <clipPath id="frame">
      <rect x="0" y="0" width="961" height="200" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="961" height="200" fill="url(#sky)"/>

    <!-- sun with a face -->
    <g stroke="#F2A93B" stroke-width="4" stroke-linecap="round">
      <line x1="109" y1="52" x2="119" y2="52"/>
      <line x1="101" y1="71" x2="108" y2="78"/>
      <line x1="82" y1="79" x2="82" y2="89"/>
      <line x1="63" y1="71" x2="56" y2="78"/>
      <line x1="55" y1="52" x2="45" y2="52"/>
      <line x1="63" y1="33" x2="56" y2="26"/>
      <line x1="82" y1="25" x2="82" y2="15"/>
      <line x1="101" y1="33" x2="108" y2="26"/>
    </g>
    <circle cx="82" cy="52" r="22" fill="#FFD93D" stroke="#F2A93B" stroke-width="3"/>
    <circle cx="74" cy="46" r="2.2" fill="#7A4A1F"/>
    <circle cx="90" cy="46" r="2.2" fill="#7A4A1F"/>
    <path d="M71 56 C76 61 88 61 93 56" fill="none" stroke="#7A4A1F" stroke-width="2.5" stroke-linecap="round"/>

    <!-- clouds -->
    <g fill="#FFFFFF">
      <g opacity="0.95">
        <circle cx="150" cy="34" r="13"/>
        <circle cx="165" cy="26" r="17"/>
        <circle cx="183" cy="36" r="12"/>
        <rect x="146" y="34" width="52" height="13" rx="6.5"/>
      </g>
      <g opacity="0.85">
        <circle cx="362" cy="32" r="11"/>
        <circle cx="375" cy="25" r="14"/>
        <circle cx="390" cy="33" r="10"/>
        <rect x="359" y="32" width="44" height="11" rx="5.5"/>
      </g>
    </g>

    <!-- grass -->
    <path d="M0 170 C120 161 240 177 360 169 C480 161 600 176 720 169 C840 162 900 170 961 165 V200 H0 Z" fill="#93D96F" stroke="#6FBE4E" stroke-width="3"/>

    <!-- flowers -->
    <g>
      <g>
        <circle cx="327" cy="188" r="4.5" fill="#FFFFFF" stroke="#2A2A35" stroke-width="2"/>
        <circle cx="320" cy="181" r="4.5" fill="#FFFFFF" stroke="#2A2A35" stroke-width="2"/>
        <circle cx="314" cy="187" r="4.5" fill="#FFFFFF" stroke="#2A2A35" stroke-width="2"/>
        <circle cx="320" cy="194" r="4.5" fill="#FFFFFF" stroke="#2A2A35" stroke-width="2"/>
        <circle cx="333" cy="194" r="4.5" fill="#FFFFFF" stroke="#2A2A35" stroke-width="2"/>
        <circle cx="326" cy="187" r="3.2" fill="#FFD93D"/>
      </g>
      <g>
        <circle cx="503" cy="190" r="3.8" fill="#FF9EB5" stroke="#2A2A35" stroke-width="2"/>
        <circle cx="497" cy="184" r="3.8" fill="#FF9EB5" stroke="#2A2A35" stroke-width="2"/>
        <circle cx="492" cy="189" r="3.8" fill="#FF9EB5" stroke="#2A2A35" stroke-width="2"/>
        <circle cx="497" cy="195" r="3.8" fill="#FF9EB5" stroke="#2A2A35" stroke-width="2"/>
        <circle cx="508" cy="195" r="3.8" fill="#FF9EB5" stroke="#2A2A35" stroke-width="2"/>
        <circle cx="502" cy="189" r="2.8" fill="#FFD93D"/>
      </g>
    </g>

    <!-- Snoopy, hand-drawn, facing the viewer -->
    <g stroke-linecap="round" stroke-linejoin="round">
      <!-- legs -->
      <rect x="213" y="156" width="12" height="22" rx="6" fill="#FFFFFF" stroke="#1F1F1F" stroke-width="3.6"/>
      <rect x="235" y="156" width="12" height="22" rx="6" fill="#FFFFFF" stroke="#1F1F1F" stroke-width="3.6"/>
      <!-- body -->
      <path d="M196 114 C189 138 191 150 201 158 C211 164 249 164 259 158 C269 150 271 138 264 114 Z" fill="#FFFFFF" stroke="#1F1F1F" stroke-width="3.6"/>
      <!-- arms -->
      <path d="M202 124 C196 138 197 150 202 155" fill="none" stroke="#1F1F1F" stroke-width="3.6"/>
      <path d="M258 124 C264 138 263 150 258 155" fill="none" stroke="#1F1F1F" stroke-width="3.6"/>
      <ellipse cx="203" cy="157" rx="7" ry="5" fill="#FFFFFF" stroke="#1F1F1F" stroke-width="3.6"/>
      <ellipse cx="257" cy="157" rx="7" ry="5" fill="#FFFFFF" stroke="#1F1F1F" stroke-width="3.6"/>
      <!-- feet -->
      <ellipse cx="205" cy="178" rx="28" ry="11" fill="#FFFFFF" stroke="#1F1F1F" stroke-width="3.6"/>
      <ellipse cx="255" cy="178" rx="28" ry="11" fill="#FFFFFF" stroke="#1F1F1F" stroke-width="3.6"/>
      <path d="M226 175 C229 176 231 177 233 179 M246 175 C249 176 251 177 253 179" fill="none" stroke="#1F1F1F" stroke-width="2.8"/>
      <!-- collar -->
      <path d="M198 122 C215 133 245 133 262 122" fill="none" stroke="#D94B4B" stroke-width="13"/>
      <!-- head -->
      <path d="M230 24 C201 24 183 45 183 72 C183 102 202 120 230 120 C258 120 277 102 277 72 C277 45 259 24 230 24 Z" fill="#FFFFFF" stroke="#1F1F1F" stroke-width="3.6"/>
      <!-- muzzle -->
      <path d="M230 84 C213 84 205 94 205 103 C205 114 215 118 230 118 C245 118 255 114 255 103 C255 94 247 84 230 84 Z" fill="#FFFFFF" stroke="#1F1F1F" stroke-width="3.6"/>
      <!-- ears -->
      <path d="M184 34 C164 30 152 44 152 62 C152 84 162 96 176 98 C186 98 190 90 186 82 C179 72 180 48 192 42 Z" fill="#1F1F1F" stroke="#1F1F1F" stroke-width="3.6"/>
      <path d="M276 34 C296 30 308 44 308 62 C308 84 298 96 284 98 C274 98 270 90 274 82 C281 72 280 48 268 42 Z" fill="#1F1F1F" stroke="#1F1F1F" stroke-width="3.6"/>
      <g fill="none" stroke="#FFFFFF" stroke-width="2.2" opacity="0.85">
        <path d="M174 44 C170 40 164 38 159 38"/>
        <path d="M178 58 C172 52 165 49 159 48"/>
        <path d="M177 72 C171 66 165 63 159 61"/>
        <path d="M286 44 C290 40 296 38 301 38"/>
        <path d="M282 58 C288 52 295 49 301 48"/>
        <path d="M283 72 C289 66 295 63 301 61"/>
      </g>
      <!-- eyes -->
      <ellipse cx="210" cy="68" rx="5" ry="9" fill="#1F1F1F"/>
      <ellipse cx="250" cy="68" rx="5" ry="9" fill="#1F1F1F"/>
      <path d="M201 56 C205 50 215 50 219 56" fill="none" stroke="#1F1F1F" stroke-width="3.6"/>
      <path d="M241 56 C245 50 255 50 259 56" fill="none" stroke="#1F1F1F" stroke-width="3.6"/>
      <!-- nose -->
      <ellipse cx="230" cy="92" rx="16" ry="10" fill="#1F1F1F"/>
      <!-- smile -->
      <path d="M221 110 C226 114 234 114 239 110" fill="none" stroke="#1F1F1F" stroke-width="3.4"/>
    </g>

    <!-- hearts -->
    <g fill="#E84D5E">
      <path d="M352 82 C348 76 341 78 341 84 C341 89 352 95 352 95 C352 95 363 89 363 84 C363 78 356 76 352 82 Z" opacity="0.9"/>
      <path d="M376 116 C373 111 368 112 368 117 C368 121 376 125 376 125 C376 125 384 121 384 117 C384 112 379 111 376 116 Z" opacity="0.8"/>
    </g>

    <!-- speech bubble -->
    <path d="M402 64 Q402 38 428 38 L902 38 Q930 38 930 64 L930 138 Q930 164 902 164 L466 164 L390 184 L440 164 L428 164 Q402 164 402 138 Z" fill="#FFFFFF" stroke="#2A2A35" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- greeting -->
    <g font-family="'Comic Sans MS','Chalkboard SE','Comic Neue',cursive" font-weight="700">
      <text x="442" y="92" font-size="42" fill="#D94238">Hello! 👋</text>
      <text x="442" y="142" font-size="42" fill="#24324F">Here is kosmigen</text>
    </g>

    <!-- sparkles -->
    <g fill="#F7B731">
      <path d="M700 14 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3 z"/>
      <path d="M762 24 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2 z" opacity="0.8"/>
      <path d="M328 62 l2.5 7 7 2.5 -7 2.5 -2.5 7 -2.5 -7 -7 -2.5 7 -2.5 z" opacity="0.7"/>
    </g>
  </g>
</svg>
